<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이유민 TO-DO LIST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Arial,"Noto Sans KR",sans-serif}
.container{max-width:520px;margin:auto;padding:28px 22px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}

/* 날짜 & 시간: 가장 두껍게(900) 설정 */
.date{font-size:24px;font-weight:900}
.time{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}

.title-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 28px}

/* 응원 문구: 날짜/시간보다 얇게 */
.greeting{font-size:18px;font-weight:500;margin:0;line-height:1.3;color:#222}

.percent-wrap{position:relative;text-align:right;flex-shrink:0}

/* Clear! 문구: 보이지 않을 때도 높이 공간을 유지하여 아래로 밀리지 않음 */
.clear{font-size:12px;font-weight:bold;visibility:hidden;margin-bottom:2px;height:14px;line-height:14px}
.clear.show{visibility:visible}

/* 퍼센트: 굵기는 유지하고 크기만 살짝 작게(26px) */
.percent{font-size:26px;font-weight:bold}

.progress{height:8px;background:#eee;margin-top:-18px;margin-bottom:18px;overflow:hidden}
.progress-bar{height:100%;width:0;background:#000;transition:width .3s ease}
.list{flex:1}
.task{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding:17px 4px}
.task input[type=checkbox]{width:25px;height:25px;accent-color:#000;flex-shrink:0}
.task input[type=text]{border:0;outline:0;width:100%;font-size:21px;color:#000;background:#fff}
.task input[type=text]::placeholder{color:#888}
.task.done input[type=text]{text-decoration:line-through;color:#888}
.message{border-top:5px solid #000;margin-top:-2px;padding-top:20px;text-align:center;font-size:18px;font-weight:900;line-height:1.2;white-space:nowrap}
@media(max-width:400px){
.container{padding:22px 18px}
.date,.time{font-size:20px}
.greeting{font-size:16px}
.percent{font-size:22px}
.task input[type=text]{font-size:19px}
.message{font-size:16px}
}
</style>
</head>
<body>
<div class="container">

  <!-- 상단: 날짜 & 시각 (가장 두꺼운 폰트) -->
  <div class="top">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
  </div>

  <!-- 메인 위치: 응원 문구 & 달성률(%) -->
  <div class="title-row">
    <div class="greeting">이유민님 오늘 하루도 파이팅입니다.</div>
    <div class="percent-wrap">
      <div class="clear" id="clear">Clear!</div>
      <div class="percent" id="percent">0%</div>
    </div>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="message" id="message"></div>

</div>

<script>
const STORAGE_KEY="yumin_todo_list_v3";

const messages=[
"오늘 한 일이 내일의 나를 만든다.",
"자존감은 내가 한 약속을 지키는 것에서 온다.",
"계속하면 결국 원하는 곳에 도착한다.",
"오늘 할 일을 내일 할 일이 아니다.",
"미래의 나에게 가장 좋은 선물은 오늘의 실행이다.",
"그냥 해라.",
"이제는 천천히 가면 큰일 난다.",
"뭐가 제일 우선인지 잊지 마라.",
"너 졸업할 거냐?",
"지금의 한 걸음이 원하는 미래와 가장 가깝다.",
"어설프게 공부하고 나에게 취하지 말자.",
"원래 공부=멘헤라는 항등식이다."
];

function updateDateTime(){
  const d=new Date();
  const days=["일","월","화","수","목","금","토"];

  document.getElementById("date").textContent=
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;

  document.getElementById("time").textContent=
    d.toLocaleTimeString("ko-KR",{hour12:false});
}

function load(){
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");

  const tasks=saved&&saved.length===7
    ? saved
    : ["","","","","","",""];

  tasks.forEach((task,i)=>{
    const textValue = (typeof task === "object" && task !== null) ? (task.text || "") : task;
    const doneValue = (typeof task === "object" && task !== null) ? (task.done || false) : false;
    createTask(i, textValue, doneValue);
  });

  updateProgress();
}

function save(){
  const data=[...document.querySelectorAll(".task")].map(t=>({
    text:t.querySelector("input[type=text]").value,
    done:t.querySelector("input[type=checkbox]").checked
  }));

  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  updateProgress();
}

function createTask(i,text,done){
  const row=document.createElement("div");
  row.className="task"+(done?" done":"");

  const check=document.createElement("input");
  check.type="checkbox";
  check.checked=done;

  const input=document.createElement("input");
  input.type="text";
  input.placeholder=`할 일 ${i+1}`;
  input.value=text;

  check.addEventListener("change",()=>{
    row.classList.toggle("done",check.checked);
    save();
  });

  input.addEventListener("input",save);

  row.append(check,input);
  document.getElementById("list").appendChild(row);
}

function updateProgress(){
  const checks=[
    ...document.querySelectorAll('.task input[type="checkbox"]')
  ];

  const completed=checks.filter(c=>c.checked).length;
  const percent=Math.round((completed/checks.length)*100);

  document.getElementById("percent").textContent=percent+"%";
  document.getElementById("progressBar").style.width=percent+"%";
  
  // display 대신 show 클래스로 위치 변동 없이 토글
  const clearEl = document.getElementById("clear");
  if(percent === 100){
    clearEl.classList.add("show");
  } else {
    clearEl.classList.remove("show");
  }
}

function dailyMessage(){
  const start=new Date(2026,0,1);
  const now=new Date();
  const day=Math.floor((now-start)/86400000);

  document.getElementById("message").textContent=
    "“"+messages[((day%messages.length)+messages.length)%messages.length]+"”";
}

updateDateTime();
setInterval(updateDateTime,1000);
load();
dailyMessage();
</script>
</body>
</html>
